short_bio: >-
  <p>I am a PhD researcher in Computer Science at the <a href="https://www.universityofgalway.ie/">University of Galway</a>, Ireland. My research focuses on <strong>AI agents, memory-augmented learning, continual learning, and inference-time adaptation</strong>, including how intelligent systems can preserve and use knowledge over time.</p>
  <p>I hold an MSc in Computer Science from the <strong>Federal University of Pernambuco (UFPE)</strong>, where I researched explainable AI, machine learning, and data mining, and a BSc in Statistics from the <strong>Federal University of Bahia (UFBA)</strong>.</p>
  <p>Before beginning my PhD, I worked in data science and analytics, applying statistical methods, machine learning, time-series forecasting, data engineering, and interactive dashboards to real-world problems. My interests connect research on reliable adaptive AI with practical AI systems.</p>
  <p>In September–October 2026, I volunteered as a host at the European Big Data Value Forum (EBDVF) in Galway, engaging with the European data and AI research community.</p>
  <p><strong>Research interests:</strong> AI Agents · Agentic AI · Continual Learning · Long-Term Memory · Memory-Augmented Learning · Retrieval-Augmented Generation · Temporal Reasoning · Explainable AI.</p>
  <p><strong>Technical skills:</strong> Python, R, PyTorch, SQL, MongoDB, time-series forecasting, machine learning, statistical modeling, Power BI, R Shiny, and data visualization.</p>
  <p>Find my professional background on <a href="https://www.linkedin.com/in/lucas-rabelo-ab58492a1/">LinkedIn</a>, code on <a href="https://github.com/marreapato">GitHub</a>, publications on <a href="https://scholar.google.com/citations?user=J-OGsEEAAAAJ">Google Scholar</a>, and articles on <a href="https://medium.com/@lucasrabeloufba">Medium</a>.</p>

